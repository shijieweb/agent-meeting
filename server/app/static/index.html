<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Agent Hub</title>
  <script>
  (function(){
    // ---- 相对路径 base（B 修复）：兼容反代剥离前缀，域名反代形态（/meeting、/meeting/）与直连（/）都可用 ----
    // '/meeting' → '/meeting/'；'/meeting/' → '/meeting/'；'/' → '/'
    var base = location.pathname;
    if (base.charAt(base.length - 1) !== '/') base += '/';
    document.write('<link rel="stylesheet" href="' + base + 'static/styles.css?v=20260818-2">');
    document.write('<script src="' + base + 'static/app.js?v=20260818-2"><\/script>');
  })();
  </script>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>小伙伴会议系统</h1>
      <div id="agent-status" class="agent-status"></div>
      <!-- F-e / §3.5：右上角 ☰ 浮动管理面板按钮（不跳页） -->
      <button id="panel-toggle" class="panel-toggle" aria-label="管理面板">☰</button>
    </header>

    <!-- F-e / §3.5：☰ 浮动管理面板（不跳页，URL 不变） -->
    <div id="agent-panel" class="agent-panel hidden">
      <div class="panel-header">
        <span>Agent 管理</span>
        <button id="panel-close" class="panel-close" aria-label="关闭">×</button>
      </div>
      <div id="panel-agent-list" class="panel-agent-list"></div>
      <form id="panel-create-form" class="panel-create-form">
        <input id="panel-name" type="text" placeholder="名字" maxlength="200" required>
        <input id="panel-desc" type="text" placeholder="角色介绍" maxlength="500">
        <select id="panel-scope" aria-label="可见性">
          <option value="all">所有人(@all)</option>
          <option value="direct">仅私信(direct)</option>
        </select>
        <button type="submit">添加</button>
      </form>
    </div>

    <main id="message-list" class="message-list"></main>
    <footer class="input-area">
      <textarea id="message-input" class="message-input" placeholder="输入消息..." autocomplete="off" rows="1"></textarea>
      <select id="agent-select" class="agent-select" aria-label="选择收件人">
        <option value="all">@所有人</option>
      </select>
      <button id="send-btn" class="send-btn" aria-label="发送">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
      </button>
    </footer>
  </div>
</body>
</html>
