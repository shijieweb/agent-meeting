<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Agent Hub</title>
  <script>
  (function(){
    // ---- 相对路径 base（B 修复）：兼容反代剥离前缀，域名反代形态（/meeting、/meeting/）与直连（/）都可用 ----
    // '/meeting' → '/meeting/'；'/meeting/' → '/meeting/'；'/' → '/'
    var base = location.pathname;
    if (base.charAt(base.length - 1) !== '/') base += '/';
    document.write('<link rel="stylesheet" href="' + base + 'static/styles.css?v=20260819-doc1">');
    document.write('<script src="' + base + 'static/vendor/marked.min.js"><\/script>');
    document.write('<script src="' + base + 'static/vendor/highlight.min.js"><\/script>');
    document.write('<script src="' + base + 'static/app.js?v=20260819-doc1"><\/script>');
  })();
  </script>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>小伙伴会议系统</h1>
      <div id="agent-status" class="agent-status"></div>
      <!-- R9: 总未读数徽标 -->
      <span id="header-unread-badge" class="unread-badge hidden" title="总未读消息数"></span>
      <!-- F-e / §3.5：☰ 改造（design v2.5 §六），点击 toggle 下拉菜单 -->
      <button id="panel-toggle" class="panel-toggle" aria-label="管理面板">☰</button>
    </header>

    <!-- ☰ 下拉菜单（design v2.5 §六 / AC-1）：含 Agent 管理 + 文档管理 -->
    <div id="panel-menu" class="panel-menu hidden">
      <div class="panel-menu-item" id="menu-agent-mgmt" title="Agent 管理">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        Agent 管理
      </div>
      <div class="panel-menu-item" id="menu-doc-mgmt" title="文档管理">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
        文档管理
      </div>
      <div class="panel-menu-item" id="menu-task-mgmt" title="任务管理">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        任务管理
      </div>
    </div>

    <!-- F-e / §3.5：Agent 管理面板（不跳页，URL 不变） -->
    <div id="agent-panel" class="agent-panel hidden">
      <div class="panel-header">
        <span>Agent 管理</span>
        <button id="panel-close" class="panel-close" aria-label="关闭">×</button>
      </div>
      <div id="panel-agent-list" class="panel-agent-list"></div>
      <form id="panel-create-form" class="panel-create-form">
        <input id="panel-name" type="text" placeholder="名字" maxlength="200" required>
        <input id="panel-desc" type="text" placeholder="角色介绍" maxlength="500">
        <select id="panel-scope" aria-label="可见性">
          <option value="all">所有人(@all)</option>
          <option value="direct">仅私信(direct)</option>
        </select>
        <button type="submit">添加</button>
      </form>
    </div>

    <!-- 文档管理面板（design v2.5 §六 / AC-1~22） -->
    <div id="doc-panel" class="doc-panel hidden">
      <div class="panel-header">
        <span>文档管理</span>
        <button id="doc-panel-close" class="panel-close" aria-label="关闭">×</button>
      </div>

      <!-- 上传区 -->
      <div class="doc-upload-area">
        <input type="file" id="doc-file-input" accept=".txt,.md,.json,.csv,.pdf,.docx,.png,.jpg,.jpeg" style="display:none">
        <div class="doc-upload-row">
          <button id="doc-upload-btn" class="doc-btn doc-btn-primary">上传文件</button>
          <select id="doc-overwrite-select" class="doc-select" title="覆盖已有文档（选"不覆盖"则新建）">
            <option value="">不覆盖（新建）</option>
          </select>
        </div>
        <div id="doc-upload-status" class="doc-upload-status"></div>
      </div>

      <!-- 新建文档区 -->
      <div class="doc-new-area">
        <div class="doc-new-row">
          <input id="doc-new-name" type="text" class="doc-input" placeholder="文件名（如 notes.md）" maxlength="300">
          <button id="doc-new-btn" class="doc-btn">新建文档</button>
        </div>
      </div>

      <!-- 搜索/过滤 -->
      <div class="doc-filter-area">
        <input id="doc-search-input" type="text" class="doc-input" placeholder="搜索文件名…" style="flex:1">
        <button id="doc-reload-btn" class="doc-btn">刷新</button>
      </div>

      <!-- 文档列表 -->
      <div id="doc-list" class="doc-list"></div>

      <!-- 编辑区（默认隐藏，选中文档后显示） -->
      <div id="doc-editor-area" class="doc-editor-area hidden">
        <div class="doc-editor-header">
          <span id="doc-editor-name" class="doc-editor-name"></span>
          <div class="doc-editor-actions">
            <button id="doc-editor-save" class="doc-btn doc-btn-primary">保存</button>
            <button id="doc-editor-cancel" class="doc-btn">取消</button>
          </div>
        </div>
        <div class="doc-editor-mode-tabs">
          <button id="doc-tab-edit" class="doc-tab active">编辑</button>
          <button id="doc-tab-preview" class="doc-tab">预览</button>
        </div>
        <textarea id="doc-editor-text" class="doc-editor-text" placeholder="文档内容…" style="display:block"></textarea>
        <div id="doc-editor-preview" class="doc-editor-preview hidden"></div>
        <div id="doc-change-log" class="doc-change-log"></div>
      </div>
    </div>

    <!-- 任务管理面板 -->
    <div id="task-panel" class="doc-panel hidden">
      <div class="panel-header">
        <span>任务管理</span>
        <button id="task-panel-close" class="panel-close" aria-label="关闭">×</button>
      </div>
      <div class="task-toolbar">
        <button id="task-btn-new" class="doc-btn doc-btn-primary">+ 新建任务</button>
        <button id="task-btn-refresh" class="doc-btn">刷新</button>
      </div>
      <!-- 新建任务表单（默认隐藏） -->
      <div id="task-create-form" class="task-form hidden">
        <input id="task-new-title" type="text" placeholder="任务标题" required maxlength="200">
        <textarea id="task-new-desc" placeholder="任务描述（可选）" maxlength="2000"></textarea>
        <select id="task-new-assignee">
          <option value="">选择负责人...</option>
        </select>
        <select id="task-new-priority">
          <option value="medium">中优先级</option>
          <option value="high">高优先级</option>
          <option value="urgent">紧急</option>
          <option value="low">低优先级</option>
        </select>
        <div class="task-form-actions">
          <button id="task-create-submit" class="doc-btn doc-btn-primary">创建</button>
          <button id="task-create-cancel" class="doc-btn">取消</button>
        </div>
      </div>
      <div id="task-list" class="task-list"></div>
    </div>

    <main id="message-list" class="message-list"></main>
    <footer class="input-area">
      <textarea id="message-input" class="message-input" placeholder="输入消息..." autocomplete="off" rows="1"></textarea>
      <select id="agent-select" class="agent-select" aria-label="选择收件人">
        <option value="all">@所有人</option>
      </select>
      <button id="send-btn" class="send-btn" aria-label="发送">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
      </button>
    </footer>
  </div>
</body>
</html>
